[workspace]
members = [
    "cli",
    "eval",
    "runtime/bridge-server",
    "runtime/bridge-server-client",
    "runtime/http",
    "runtime/tui",
    "src",
    "src/lsp",
    "src/mcp",
    "src/protocol",
    "src/provider",
    "src/session",
    "src/telemetry",
    "src/tools",
    "swarm",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
repository = "https://github.com/LianWeiSQ/openagent-ai"
rust-version = "1.85"

[workspace.dependencies]
openagent-bridge-server = { path = "runtime/bridge-server" }
openagent-bridge-server-client = { path = "runtime/bridge-server-client" }
openagent-core = { path = "src" }
openagent-eval = { path = "eval" }
openagent-lsp = { path = "src/lsp" }
openagent-mcp = { path = "src/mcp" }
openagent-protocol = { path = "src/protocol" }
openagent-provider = { path = "src/provider" }
openagent-session = { path = "src/session" }
openagent-telemetry = { path = "src/telemetry" }
openagent-swarm = { path = "swarm" }
openagent-tools = { path = "src/tools" }
openagent-tui = { path = "runtime/tui" }
async-trait = "0.1"
base64 = "0.22"
fs2 = "0.4"
opentelemetry = { version = "0.32", default-features = false, features = ["metrics", "trace"] }
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["http-proto", "reqwest-blocking-client", "trace"] }
opentelemetry-prometheus = { version = "0.32", default-features = false }
opentelemetry_sdk = { version = "0.32", default-features = false, features = ["metrics", "trace"] }
prometheus = { version = "0.14", default-features = false }
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
regex = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha1 = "0.10"
sha2 = "0.10"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread", "time"] }
url = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"
