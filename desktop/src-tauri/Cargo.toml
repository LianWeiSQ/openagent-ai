[package]
name = "openagent-desktop"
version = "0.1.0"
description = "OpenAgent Desktop shell"
authors = ["OpenAgent"]
edition = "2021"

[workspace]

[lib]
name = "openagent_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
getrandom = "0.3"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
