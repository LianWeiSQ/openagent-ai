extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  filelog/openharness-ledger:
    include:
      - /var/lib/openharness/sessions/*/runs/*/events.jsonl
    start_at: end
    include_file_path: true
    operators:
      - type: json_parser
        parse_from: body

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 384
    spike_limit_mib: 96
  resource/ledger:
    attributes:
      - key: service.name
        value: openharness-ledger
        action: upsert
  attributes/privacy:
    actions:
      - key: gen_ai.prompt
        action: delete
      - key: gen_ai.completion
        action: delete
      - key: http.request.header.authorization
        action: delete
      - key: enduser.id
        action: delete
  batch:
    send_batch_size: 512
    timeout: 1s

exporters:
  otlphttp/tempo:
    endpoint: http://tempo:4318
    sending_queue:
      enabled: true
      queue_size: 2048
    retry_on_failure:
      enabled: true
      max_elapsed_time: 60s
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
    sending_queue:
      enabled: true
      queue_size: 2048
    retry_on_failure:
      enabled: true
      max_elapsed_time: 60s

service:
  extensions: [health_check]
  telemetry:
    logs:
      level: info
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, attributes/privacy, batch]
      exporters: [otlphttp/tempo]
    logs/otlp:
      receivers: [otlp]
      processors: [memory_limiter, attributes/privacy, batch]
      exporters: [otlphttp/loki]
    logs/ledger:
      receivers: [filelog/openharness-ledger]
      processors: [memory_limiter, resource/ledger, attributes/privacy, batch]
      exporters: [otlphttp/loki]
