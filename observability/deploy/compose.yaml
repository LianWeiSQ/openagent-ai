name: openharness-observability

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:${OTEL_COLLECTOR_VERSION:-0.157.0}
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - ./otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
      - ${OPENHARNESS_SESSION_ROOT:-./data/sessions}:/var/lib/openharness/sessions:ro
    ports:
      - "${OBSERVABILITY_BIND_ADDRESS:-127.0.0.1}:${OTLP_GRPC_PORT:-4317}:4317"
      - "${OBSERVABILITY_BIND_ADDRESS:-127.0.0.1}:${OTLP_HTTP_PORT:-4318}:4318"
    depends_on:
      - tempo
      - loki
    networks: [observability]

  prometheus:
    image: prom/prometheus:${PROMETHEUS_VERSION:-v3.12.0}
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
      - --web.enable-lifecycle
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - ../prometheus/openharness-alerts.yaml:/etc/prometheus/rules/openharness-alerts.yaml:ro
      - ./secrets/metrics-token:/run/secrets/openharness-metrics-token:ro
      - prometheus-data:/prometheus
    ports:
      - "${OBSERVABILITY_BIND_ADDRESS:-127.0.0.1}:${PROMETHEUS_PORT:-9090}:9090"
    extra_hosts:
      - host.docker.internal:host-gateway
    networks: [observability]

  tempo:
    image: grafana/tempo:${TEMPO_VERSION:-2.10.7}
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - ./tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    networks: [observability]

  loki:
    image: grafana/loki:${LOKI_VERSION:-3.7.2}
    command: ["-config.file=/etc/loki/loki.yaml"]
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - ./loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    networks: [observability]

  grafana:
    image: grafana/grafana:${GRAFANA_VERSION:-13.1.0}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana-admin-password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
      - ../grafana/dashboards:/var/lib/grafana/dashboards/openharness:ro
      - ./secrets/grafana-admin-password:/run/secrets/grafana-admin-password:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${OBSERVABILITY_BIND_ADDRESS:-127.0.0.1}:${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus
      - tempo
      - loki
    networks: [observability]

networks:
  observability:
    internal: true

volumes:
  prometheus-data:
  tempo-data:
  loki-data:
  grafana-data:
